seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 50000
empirical_normalization: true
obs_groups:
  policy:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 1000
experiment_name: k1_fight_001
run_name: finetune_from_25000
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-05-04_18-25-30
load_checkpoint: model_25000.pt
class_name: OnPolicyRunner
actor: {}
critic: {}
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: null
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
  actor_loss_mode: apa
  apa_beta: 0.1
  apa_normalize_advantage: false
  apa_target_shift_clip: 1.0
  ref_policy_sync_interval: 20
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
